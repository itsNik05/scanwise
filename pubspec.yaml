name: scanwise
version: 1.0.0+1
description: DocForge-inspired PDF toolbox UI built with Flutter.
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  path_provider: ^2.1.2
  pdfx: ^2.6.0
  share_plus: ^7.2.1
  syncfusion_flutter_pdf: ^25.1.35
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  image: ^4.2.0
  google_mlkit_document_scanner: ^0.3.0
  reorderable_grid_view: ^2.2.6
  get_it: ^7.6.0
  pdf: ^3.10.8
  uuid: ^4.3.3

flutter:
  uses-material-design: true